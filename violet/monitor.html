<div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <span style="font-size:10px;font-weight:700;color:var(--accent-violet);">VIOLET LABS</span>
        <span style="font-size:8px;color:var(--text-muted);" id="violet-update-time"></span>
    </div>
    <div class="violet-lab-grid" id="violet-lab-observe" hx-get="/api/Violet/labs" hx-trigger="load, every 15s" hx-headers='js:{"Authorization":"Bearer "+localStorage.getItem("abitat_token")}' hx-swap="innerHTML">
        <div style="text-align:center;padding:20px;color:var(--text-muted);">Loading labs...</div>
    </div>
</div>

<script>
(function() {
    document.body.addEventListener('htmx:afterRequest', function(evt) {
        if (evt.detail.target.id === 'violet-lab-observe') {
            try {
                var labs = JSON.parse(evt.detail.xhr.responseText);
                if (!Array.isArray(labs)) labs = [];
                evt.detail.target.innerHTML = labs.map(function(l) {
                    return '<div class="vlab-item">' +
                        '<span class="vlab-name">' + (l.name || l.id) + '</span>' +
                        '<span class="vlab-os">' + (l.image || 'kali') + '</span>' +
                        '<div class="vlab-info"><span>' + (l.ip || '0.0.0.0') + '</span><span class="vlab-dot ' + (l.status === 'online' ? 'online' : 'offline') + '"></span></div>' +
                        '</div>';
                }).join('') || '<div style="text-align:center;padding:10px;color:var(--text-muted);">No active labs.</div>';
                document.getElementById('violet-update-time').textContent = new Date().toLocaleTimeString();
            } catch(e) {}
        }
    });
})();
</script>
