<div class="violet-dashboard">
    <div class="violet-topbar">
        <span class="violet-logo">CREATE LAB</span>
        <div class="violet-telemetry">
            <button class="action-btn" hx-get="/violet/labs/list.html" hx-target="#panel-violet" hx-swap="innerHTML">LIST</button>
        </div>
    </div>
    <div class="create-layout">
        <div class="violet-card">
            <div class="card-header"><h3>NEW INSTANCE</h3></div>
            <form id="lab-create-form">
                <div class="form-group"><label>NAME</label><input type="text" name="name" class="form-control" required></div>
                <div class="form-group"><label>IMAGE</label><input type="text" name="image" class="form-control" value="kalilinux/kali-rolling:latest"></div>
                <div class="modal-actions" style="margin-top:16px;">
                    <button type="submit" class="action-btn btn-primary">DEPLOY</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
(function() {
    var token = localStorage.getItem('abitat_token') || '';
    document.getElementById('lab-create-form').addEventListener('submit', function(e) {
        e.preventDefault();
        var form = this;
        var data = new FormData(form);
        var json = {};
        data.forEach(function(v, k) { json[k] = v; });

        var id = json.name.toLowerCase().replace(/\s+/g, '-');
        form.setAttribute('hx-put', '/api/Lab/' + id);
        fetch('/api/Lab/' + id, {
            method: 'PUT',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify(json)
        }).then(function() {
            form.setAttribute('hx-post', '/api/Lab');
            form.setAttribute('hx-headers', JSON.stringify({Authorization:'Bearer '+token}));
            htmx.trigger('#labs-list', 'labUpdated');
        });
    });
})();
</script>
