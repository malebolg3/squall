<div class="violet-dashboard">
    <div class="violet-topbar">
        <span class="violet-logo">VIOLET LABS</span>
        <div class="violet-telemetry">
            <button class="action-btn" hx-get="/violet/monitor.html" hx-target="#panel-violet" hx-swap="innerHTML">MONITOR</button>
            <button class="action-btn" hx-get="/violet/labs/create.html" hx-target="#panel-violet" hx-swap="innerHTML">CREATE</button>
        </div>
    </div>

    <table class="violet-table">
        <thead>
            <tr><th>NAME</th><th>IMAGE</th><th>STATUS</th><th>IP</th><th>ACTIONS</th></tr>
        </thead>
        <tbody id="labs-list" hx-get="/api/Lab" hx-trigger="load, labUpdated from:body" hx-headers='js:{"Authorization":"Bearer "+localStorage.getItem("abitat_token")}' hx-swap="none">
            <tr><td colspan="5" style="text-align:center;padding:20px;color:var(--text-muted);">Loading labs...</td></tr>
        </tbody>
    </table>
</div>

<script>
(function() {
    var token = localStorage.getItem('abitat_token') || '';
    document.body.addEventListener('htmx:afterRequest', function(evt) {
        if (evt.detail.target.id === 'labs-list') return;
    });
    document.body.addEventListener('labUpdated', function() {
        var tbody = document.getElementById('labs-list');
        if (!tbody) return;
        fetch('/api/Lab', { headers: { 'Authorization': 'Bearer ' + token } })
            .then(function(r) { return r.json(); })
            .then(function(labs) {
                if (!Array.isArray(labs)) labs = [];
                tbody.innerHTML = labs.map(function(l) {
                    var id = l.id || l.name || '';
                    return '<tr>' +
                        '<td>' + (l.name || id) + '</td>' +
                        '<td>' + (l.image || 'kali') + '</td>' +
                        '<td><span class="status-dot ' + (l.status === 'online' ? 'status-online' : 'status-offline') + '"></span> ' + (l.status || 'offline') + '</td>' +
                        '<td>' + (l.ip || '0.0.0.0') + '</td>' +
                        '<td>' +
                            '<button class="action-btn btn-success-light" hx-post="/api/Lab/' + id + '/start" hx-headers=\'js:{"Authorization":"Bearer "+localStorage.getItem("abitat_token")}\' hx-target="#labs-list" hx-swap="none">START</button> ' +
                            '<button class="action-btn btn-warning-light" hx-post="/api/Lab/' + id + '/stop" hx-headers=\'js:{"Authorization":"Bearer "+localStorage.getItem("abitat_token")}\' hx-target="#labs-list" hx-swap="none">STOP</button> ' +
                            '<button class="action-btn" hx-post="/api/Lab/' + id + '/exec" hx-headers=\'js:{"Authorization":"Bearer "+localStorage.getItem("abitat_token"),"Content-Type":"application/json"}\' hx-vals=\'{"command":"id"}\' hx-target="#lab-detail-panel">EXEC</button> ' +
                            '<button class="action-btn btn-danger-light" hx-delete="/api/Lab/' + id + '" hx-headers=\'js:{"Authorization":"Bearer "+localStorage.getItem("abitat_token")}\' hx-confirm="Remove this lab?" hx-target="#labs-list" hx-swap="none">DEL</button>' +
                        '</td>' +
                        '</tr>';
                }).join('');
                htmx.process(tbody);
            });
    });
})();
</script>
