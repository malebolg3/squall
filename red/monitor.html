<div class="red-dashboard">
    <div class="red-topbar">
        <span class="red-logo">RED MONITOR</span>
        <div class="red-telemetry">
            <span class="txt-red">SCANS</span>
            <span class="txt-orange">EXPLOITS</span>
        </div>
    </div>

    <div class="monitor-grid">
        <div class="monitor-panel">
            <div class="section-title scan">SCANS</div>
            <div class="scan-list" id="red-scan-monitor" hx-get="/api/Scan" hx-trigger="load, every 20s" hx-headers='js:{"Authorization":"Bearer "+localStorage.getItem("abitat_token")}' hx-swap="innerHTML">
                <div style="text-align:center;padding:20px;color:var(--text-muted);">Loading scans...</div>
            </div>
        </div>
        <div class="monitor-panel">
            <div class="section-title pent">EXPLOITS</div>
            <div class="scan-list" id="red-exploit-monitor" hx-get="/api/Exploit/sessions" hx-trigger="load, every 15s" hx-headers='js:{"Authorization":"Bearer "+localStorage.getItem("abitat_token")}' hx-swap="innerHTML">
                <div style="text-align:center;padding:20px;color:var(--text-muted);">Loading exploits...</div>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    var API_BASE = window.__API_RED__ || (window.location.hostname === 'localhost' ? 'http://localhost:10002' : '');
    var token = localStorage.getItem('abitat_token') || '';
    var headers = { 'Authorization': 'Bearer ' + token };

    document.body.addEventListener('htmx:afterRequest', function(evt) {
        if (evt.detail.target.id === 'red-scan-monitor') {
            try {
                var data = JSON.parse(evt.detail.xhr.responseText);
                var scans = data.scans || data || [];
                if (!Array.isArray(scans)) scans = [];
                evt.detail.target.innerHTML = scans.map(function(s) {
                    return '<div class="scan-item">' +
                        '<span class="scan-target">' + (s.target||s.id) + '</span>' +
                        '<div class="scan-meta"><span>' + (s.type||'scan') + '</span><span class="scan-status ' + (s.status||'').toLowerCase() + '">' + (s.status||'pending') + '</span></div>' +
                        '</div>';
                }).join('') || '<div style="text-align:center;padding:10px;color:var(--text-muted);">No scans.</div>';
            } catch(e) {}
        }
        if (evt.detail.target.id === 'red-exploit-monitor') {
            try {
                var data = JSON.parse(evt.detail.xhr.responseText);
                var sessions = data.sessions || data || [];
                if (!Array.isArray(sessions)) sessions = [];
                evt.detail.target.innerHTML = sessions.map(function(s) {
                    return '<div class="scan-item">' +
                        '<span class="scan-target">' + (s.target||s.id) + '</span>' +
                        '<div class="scan-meta"><span>' + (s.type||'exploit') + '</span><span class="scan-status ' + (s.status||'').toLowerCase() + '">' + (s.status||'active') + '</span></div>' +
                        '</div>';
                }).join('') || '<div style="text-align:center;padding:10px;color:var(--text-muted);">No sessions.</div>';
            } catch(e) {}
        }
    });
})();
</script>
