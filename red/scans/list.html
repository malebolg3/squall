<div class="red-dashboard">
    <div class="red-topbar">
        <span class="red-logo">RED SCANS</span>
        <div class="red-telemetry">
            <button class="action-btn" hx-get="/red/monitor.html" hx-target="#panel-red" hx-swap="innerHTML">MONITOR</button>
            <button class="action-btn" hx-get="/red/tool.html" hx-target="#panel-red" hx-swap="innerHTML">TOOLS</button>
            <button class="action-btn" hx-get="/red/exploits/list.html" hx-target="#panel-red" hx-swap="innerHTML">EXPLOITS</button>
        </div>
    </div>

    <div class="red-stats-strip">
        <div class="strip-card"><span class="strip-label">TOTAL</span><span class="strip-value" id="scan-total">0</span></div>
        <div class="strip-card"><span class="strip-label">COMPLETED</span><span class="strip-value txt-green" id="scan-completed">0</span></div>
        <div class="strip-card"><span class="strip-label">RUNNING</span><span class="strip-value txt-orange" id="scan-running">0</span></div>
        <div class="strip-card"><span class="strip-label">FAILED</span><span class="strip-value txt-red" id="scan-failed">0</span></div>
    </div>

    <div class="red-main-layout">
        <table class="red-table">
            <thead>
                <tr><th>ID</th><th>TARGET</th><th>TYPE</th><th>STATUS</th><th>CREATED</th><th>ACTIONS</th></tr>
            </thead>
            <tbody id="scans-list" hx-get="/api/Scan" hx-trigger="load, every 20s" hx-headers='js:{"Authorization":"Bearer "+localStorage.getItem("abitat_token")}' hx-swap="innerHTML swap:0.3s">
                <tr><td colspan="6" style="text-align:center;padding:20px;color:var(--text-muted);">Loading scans...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
(function() {
    var API_BASE = window.__API_RED__ || (window.location.hostname === 'localhost' ? 'http://localhost:10002' : '');
    var token = localStorage.getItem('abitat_token') || '';
    var headers = { 'Authorization': 'Bearer ' + token };

    document.body.addEventListener('htmx:afterRequest', function(evt) {
        if (evt.detail.target.id === 'scans-list') {
            try {
                var data = JSON.parse(evt.detail.xhr.responseText);
                var scans = data.scans || data || [];
                if (!Array.isArray(scans)) scans = [];
                document.getElementById('scan-total').textContent = scans.length;
                document.getElementById('scan-completed').textContent = scans.filter(function(s) { return (s.status||'').toLowerCase() === 'completed'; }).length;
                document.getElementById('scan-running').textContent = scans.filter(function(s) { return (s.status||'').toLowerCase() === 'running'; }).length;
                document.getElementById('scan-failed').textContent = scans.filter(function(s) { return (s.status||'').toLowerCase() === 'failed'; }).length;
            } catch(e) {}
        }
    });
})();
</script>
