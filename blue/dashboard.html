<div class="blue-dashboard">
    <div class="blue-topbar">

        <div class="blue-telemetry">
            <div class="tel-item"><span class="status-dot blue-pulse"></span>SIEM: <strong class="txt-blue">CONNECTED</strong></div>
            <div class="tel-item"><span class="status-dot green-pulse"></span>AGENTS: <strong class="txt-green" id="agents-online">4</strong></div>
            <div class="tel-item"><span class="status-dot violet-pulse"></span>LABS: <strong class="txt-violet" id="labs-running">2</strong></div>
            <div class="tel-item"><span class="status-dot orange-pulse"></span>SCANS: <strong class="txt-orange" id="scans-active">1</strong></div>
            <div class="tel-item">EPS: <strong class="txt-amber">2.3k</strong></div>

    <div class="blue-stats-strip">
        <div class="strip-card">
            <span class="strip-label">ASSETS</span>

            <span class="strip-label">INCIDENTS</span>

        </div>
        <div class="strip-card">
            <span class="strip-label">GRAPH</span>
            <span class="strip-value">NET</span>
            <div class="progress-bar"><div class="progress-fill" style="width:100%;background:var(--accent-violet);"></div></div>

    <div class="blue-monitor-grid" id="blue-content">
        <div class="monitor-row" id="row-top">
            <div class="monitor-quad mon-resizable" id="quad-violet" style="flex:1;">

                <div class="quad-content" id="content-red">

        </div>
        <div class="monitor-row" id="row-bottom">
            <div class="monitor-quad mon-resizable" id="quad-silver" style="flex:1;">
                <div class="quad-handle quad-handle-right" data-quad="quad-silver" data-dir="h"></div>

                </div>

    </div>
    <div class="resize-overlay" id="resize-overlay"></div>
</div>

<script>
(function () {
    'use strict';

    const TOKEN_KEY = 'malebolge_token';
    const CSRF_HEADER = 'X-CSRF-Token';
    const isDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

    window.API = Object.freeze({
        blue: isDev ? 'http://localhost:10001/api' : '/api',
        red: isDev ? 'http://localhost:10002/api' : '/api',
        violet: isDev ? 'http://localhost:10003/api' : '/api',
        silver: isDev ? 'http://localhost:10004/api' : '/api'
    });

    window.api = {
        token: () => localStorage.getItem(TOKEN_KEY),

        headers() {
            const token = this.token();
            const csrf = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content');
            return {
                'Authorization': token ? `Bearer ${token}` : '',
                'Content-Type': 'application/json',
                'X-Requested-With': 'XMLHttpRequest',
                ...(csrf && { [CSRF_HEADER]: csrf })
            };
        },

        async _fetch(url, options) {
            try {
                const res = await fetch(url, options);
                if (res.status === 401) {
                    window.logout();
                    throw new Error('SIEM Unauthenticated - Session Terminated');
                }
                if (!res.ok) throw new Error(`SIEM Threat API HTTP ${res.status}`);
                return res.status === 204 ? null : await res.json();
            } catch (err) {
                console.error(`[SIEM-SEC-ERR] ${err.message}`);
                throw err;
            }
        },

        save(service, type, id, data) {
            const sanitizeId = id ? String(id).replace(/[^\w-]/g, '') : '';
            const endpoint = `${window.API[service]}/${type}${sanitizeId ? '/' + sanitizeId : ''}`;
            return this._fetch(endpoint, {
                method: id ? 'PUT' : 'POST',
                headers: this.headers(),
                body: JSON.stringify(data)
            });
        },

        del(service, type, id) {
            const sanitizeId = String(id).replace(/[^\w-]/g, '');
            return this._fetch(`${window.API[service]}/${type}/${sanitizeId}`, {
                method: 'DELETE',
                headers: this.headers()
            });
        },

        get(service, type, id) {
            const sanitizeId = id ? String(id).replace(/[^\w-]/g, '') : '';
            return this._fetch(`${window.API[service]}/${type}${sanitizeId ? '/' + sanitizeId : ''}`, {
                headers: this.headers()
            });
        }
    };

    document.addEventListener('DOMContentLoaded', () => {
        if (!window.api.token()) {
            const panel = document.getElementById('panel-blue');
            if (panel) panel.style.display = 'block';

            setTimeout(() => {
                const scroll = document.getElementById('main-scroll');
                if (scroll) scroll.scrollLeft = 0;
            }, 500);
        }
    });

    document.body.addEventListener('htmx:configRequest', (e) => {
        const token = window.api.token();
        if (token) e.detail.headers['Authorization'] = `Bearer ${token}`;

        const csrf = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content');
        if (csrf) e.detail.headers[CSRF_HEADER] = csrf;

        e.detail.headers['X-Requested-With'] = 'XMLHttpRequest';
    });

    document.body.addEventListener('htmx:afterRequest', (e) => {
        const path = e.detail.pathInfo?.requestPath || '';
        const contentType = e.detail.xhr.getResponseHeader('Content-Type') || '';
        if (!contentType.includes('application/json')) return;

        try {
            const res = JSON.parse(e.detail.xhr.responseText);
            if (!res.success || !res.data) return;

            if (path.includes('/Auth/authorize') && res.data.requires2FA) {
                if (typeof window.render2FA === 'function') {
                    window.render2FA(res.data.username || 'admin');
                }
            }
            if (path.includes('/Auth/verify-2fa') && res.data.token) {
                localStorage.setItem(TOKEN_KEY, res.data.token);
                if (typeof window.showDashboard === 'function') window.showDashboard();
            }
            if (path.includes('/Auth/register') && typeof window.renderLogin === 'function') {
                window.renderLogin();
            }
        } catch (ex) {
            console.warn('[SIEM-PARSE-WARN] Malformed JSON structure response');
        }
    });

    document.body.addEventListener('htmx:responseError', (e) => {
        if (e.detail.xhr.status === 401) window.logout();
    });

    window.logout = () => {
        localStorage.removeItem(TOKEN_KEY);
        if (typeof window.updateHeaderVisibility === 'function') window.updateHeaderVisibility();
        if (typeof window.closeChat === 'function') window.closeChat();
        if (typeof window.renderLogin === 'function') window.renderLogin();
    };

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
    }
})();
</script>
