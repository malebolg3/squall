<div class="silver-dashboard">
    <div class="silver-topbar">
        <span class="silver-logo">ORCHESTRATION</span>
        <div class="silver-telemetry">
            <span style="font-size:9px;color:var(--text-muted);">WORKFLOW ENGINE</span>
        </div>
    </div>

    <div class="orchestration-grid">
        <div class="silver-card">
            <div class="card-header"><h3>WORKFLOWS</h3></div>
            <div class="workflow-actions">
                <button class="quick-action" hx-post="/api/Orchestration/workflow/scan" hx-headers='js:{"Authorization":"Bearer "+localStorage.getItem("abitat_token")}' hx-target="#workflow-result" hx-swap="innerHTML">SCAN</button>
                <button class="quick-action" hx-post="/api/Orchestration/workflow/pentest" hx-headers='js:{"Authorization":"Bearer "+localStorage.getItem("abitat_token")}' hx-target="#workflow-result" hx-swap="innerHTML">PENTEST</button>
                <button class="quick-action full" hx-post="/api/Orchestration/workflow/full" hx-headers='js:{"Authorization":"Bearer "+localStorage.getItem("abitat_token")}' hx-target="#workflow-result" hx-swap="innerHTML">FULL ATTACK</button>
                <button class="quick-action" hx-post="/api/Orchestration/ai/analyze" hx-headers='js:{"Authorization":"Bearer "+localStorage.getItem("abitat_token")}' hx-vals='js:{"context":"security-analysis","data":"Analyze current security posture"}' hx-target="#workflow-result" hx-swap="innerHTML">AI ANALYZE</button>
            </div>
            <div id="workflow-result" style="margin-top:12px;font-size:10px;color:var(--text-muted);">Select a workflow to execute.</div>
        </div>

        <div class="silver-card">
            <div class="card-header"><h3>CONSOLE</h3></div>
            <div class="silver-chat" id="orch-chat-box"><div class="chat-msg system">Orchestration engine ready.</div></div>
            <div class="silver-chat-input">
                <input type="text" id="orch-input" class="form-control" placeholder="Command..." onkeypress="if(event.key==='Enter')sendOrch()" style="flex:1;">
                <button class="action-btn" onclick="sendOrch()" style="background:var(--accent-silver);color:var(--bg-main);">RUN</button>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    var API = window.__API_SILVER__ || (window.location.hostname === 'localhost' ? 'http://localhost:10004' : '');
    var token = localStorage.getItem('abitat_token') || '';

    window.sendOrch = function() {
        var input = document.getElementById('orch-input');
        var cmd = input.value.trim();
        if (!cmd) return;
        var chat = document.getElementById('orch-chat-box');
        chat.innerHTML += '<div class="chat-msg user">' + cmd + '</div>';
        fetch('/api/Orchestration/ai/analyze', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ context: 'orchestration', data: cmd })
        }).then(function(r) { return r.json(); })
          .then(function(d) { chat.innerHTML += '<div class="chat-msg system">' + (d.analysis || 'Done.') + '</div>'; chat.scrollTop = chat.scrollHeight; })
          .catch(function() { chat.innerHTML += '<div class="chat-msg system">Connection failed.</div>'; });
        input.value = '';
        chat.scrollTop = chat.scrollHeight;
    };
})();
</script>
