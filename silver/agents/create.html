<div class="silver-dashboard">
    <div class="silver-topbar">
        <span class="silver-logo">CREATE AGENT</span>
        <div class="silver-telemetry">
            <button class="action-btn" hx-get="/silver/agents/list.html" hx-target="#panel-silver" hx-swap="innerHTML">LIST</button>
        </div>
    </div>

    <div class="silver-main-grid">
        <div class="silver-card">
            <div class="card-header"><h3>NEW AGENT</h3></div>
            <form id="agent-create-form">
                <div class="form-group"><label>AGENT TYPE</label>
                    <select name="agentType" class="form-control">
                        <option value="blue">Blue (Defense)</option>
                        <option value="red">Red (Offense)</option>
                        <option value="violet">Violet (Labs)</option>
                        <option value="silver">Silver (AI)</option>
                    </select>
                </div>
                <div class="form-group"><label>EXPERTISE</label><input type="text" name="expertise" class="form-control" value="security-analyst"></div>
                <div class="form-group"><label>OWNER ID</label><input type="text" name="ownerId" class="form-control" value="admin"></div>
                <button type="submit" class="action-btn btn-primary" style="width:100%;">CREATE</button>
            </form>
        </div>
    </div>
</div>

<script>
(function() {
    var API = window.__API_SILVER__ || (window.location.hostname === 'localhost' ? 'http://localhost:10004' : '');
    var token = localStorage.getItem('abitat_token') || '';

    document.getElementById('agent-create-form').addEventListener('submit', function(e) {
        e.preventDefault();
        var form = this;
        var data = new FormData(form);
        var json = {};
        data.forEach(function(v, k) { json[k] = v; });

        fetch('/api/Orchestration/agents/' + json.agentType + '/create', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify(json)
        }).then(function(r) { return r.text(); })
          .then(function(id) {
              alert('Agent created: ' + id);
              htmx.ajax('GET', '/silver/agents/list.html', {target: '#panel-silver', swap: 'innerHTML'});
          });
    });
})();
</script>
