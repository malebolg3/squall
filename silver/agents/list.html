<div class="silver-dashboard">
    <div class="silver-topbar">
        <span class="silver-logo">AGENTS</span>
        <div class="silver-telemetry">
            <button class="action-btn" hx-get="/silver/agents/create.html" hx-target="#panel-silver" hx-swap="innerHTML">CREATE</button>
            <button class="action-btn" hx-get="/silver/monitor.html" hx-target="#panel-silver" hx-swap="innerHTML">MONITOR</button>
        </div>
    </div>

    <div class="agent-panels">
        <div class="agent-panel blue">
            <div class="card-header"><h3>BLUE AGENT</h3><span class="badge badge-blue">DEFENSE</span></div>
            <div style="display:flex;flex-direction:column;gap:6px;">
                <button class="agent-btn" hx-post="/api/Orchestration/agents/blue/scan" hx-headers='js:{"Authorization":"Bearer "+localStorage.getItem("abitat_token")}' hx-vals='js:{Target: localStorage.getItem("red_target")||"10.10.20.15", ScanType:"full"}' hx-target="#agent-result" hx-swap="innerHTML">TRIGGER SCAN</button>
                <button class="agent-btn" hx-get="/api/Orchestration/agents/blue/assets" hx-headers='js:{"Authorization":"Bearer "+localStorage.getItem("abitat_token")}' hx-target="#agent-result" hx-swap="innerHTML">GET ASSETS</button>
            </div>
        </div>

        <div class="agent-panel red">
            <div class="card-header"><h3>RED AGENT</h3><span class="badge badge-red">OFFENSE</span></div>
            <div style="display:flex;flex-direction:column;gap:6px;">
                <button class="agent-btn" hx-post="/api/Orchestration/agents/red/exploit" hx-headers='js:{"Authorization":"Bearer "+localStorage.getItem("abitat_token")}' hx-vals='js:{Target: localStorage.getItem("red_target")||"10.10.20.15", ExploitName:"metasploit"}' hx-target="#agent-result" hx-swap="innerHTML">TRIGGER EXPLOIT</button>
            </div>
        </div>

        <div class="agent-panel violet">
            <div class="card-header"><h3>VIOLET AGENT</h3><span class="badge badge-violet">LABS</span></div>
            <div style="display:flex;flex-direction:column;gap:6px;">
                <button class="agent-btn" hx-get="/api/Orchestration/agents/violet/labs" hx-headers='js:{"Authorization":"Bearer "+localStorage.getItem("abitat_token")}' hx-target="#labs-result" hx-swap="innerHTML">LIST LABS</button>
                <button class="agent-btn" hx-post="/api/Orchestration/agents/violet/cleanup" hx-headers='js:{"Authorization":"Bearer "+localStorage.getItem("abitat_token")}' hx-target="#agent-result" hx-swap="innerHTML">CLEANUP EXPIRED</button>
            </div>
        </div>

        <div class="agent-panel silver">
            <div class="card-header"><h3>SILVER AGENT</h3><span class="badge badge-silver">AI</span></div>
            <div style="display:flex;flex-direction:column;gap:6px;">
                <button class="agent-btn" hx-post="/api/Orchestration/agents/silver/context" hx-headers='js:{"Authorization":"Bearer "+localStorage.getItem("abitat_token")}' hx-vals='js:{Context:"security-analysis"}' hx-target="#agent-result" hx-swap="innerHTML">SET CONTEXT</button>
            </div>
        </div>
    </div>

    <div id="agent-result" style="margin-top:12px;"></div>
    <div id="labs-result" style="margin-top:12px;"></div>
</div>

<script>
(function() {
    var API = window.__API_SILVER__ || (window.location.hostname === 'localhost' ? 'http://localhost:10004' : '');
})();
</script>
