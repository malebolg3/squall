<div class="silver-dashboard">
    <div class="silver-topbar">
        <span class="silver-logo">OBSIDIAN VAULT</span>
        <div class="silver-telemetry">
            <span style="font-size:9px;color:var(--accent-green);" id="obsidian-health">CHECKING...</span>
        </div>
    </div>

    <div class="obsidian-read-row">
        <input type="text" id="vault-name" class="form-control" placeholder="Vault name (ai-analysis)" value="ai-analysis" style="flex:1;">
        <input type="text" id="note-id" class="form-control" placeholder="Note ID" style="flex:1;">
        <button class="action-btn btn-primary" onclick="readNote()">READ</button>
    </div>

    <div class="search-row" style="margin-bottom:8px;">
        <input type="text" id="search-vault" class="form-control" placeholder="Vault" value="ai-analysis" style="flex:1;">
        <input type="text" id="search-query" class="form-control" placeholder="Search query..." style="flex:2;">
        <button class="action-btn" onclick="searchNotes()">SEARCH</button>
    </div>

    <div id="obsidian-result" class="notes-list">
        <div style="text-align:center;padding:10px;color:var(--text-muted);">Use search to find notes.</div>
    </div>
</div>

<script>
(function() {
    var API = window.__API_SILVER__ || (window.location.hostname === 'localhost' ? 'http://localhost:10004' : '');
    var token = localStorage.getItem('abitat_token') || '';
    var headers = { 'Authorization': 'Bearer ' + token };

    fetch('/api/Obsidian/health', { headers: headers })
        .then(function(r) { return r.json(); })
        .then(function(d) { document.getElementById('obsidian-health').textContent = d.status === 'healthy' ? 'CONNECTED' : 'OFFLINE'; })
        .catch(function() { document.getElementById('obsidian-health').textContent = 'OFFLINE'; });

    window.readNote = function() {
        var vault = document.getElementById('vault-name').value;
        var noteId = document.getElementById('note-id').value;
        if (!vault || !noteId) return;
        fetch('/api/Obsidian/vaults/' + vault + '/notes/' + noteId, { headers: headers })
            .then(function(r) { return r.text(); })
            .then(function(html) { document.getElementById('obsidian-result').innerHTML = '<div class="note-item expanded"><div class="note-item-content">' + html + '</div></div>'; });
    };

    window.searchNotes = function() {
        var vault = document.getElementById('search-vault').value;
        var query = document.getElementById('search-query').value;
        if (!vault || !query) return;
        document.getElementById('obsidian-result').innerHTML = '<div style="text-align:center;padding:10px;color:var(--text-muted);">Searching...</div>';
        fetch('/api/Obsidian/vaults/' + vault + '/search?query=' + encodeURIComponent(query), { headers: headers })
            .then(function(r) { return r.json(); })
            .then(function(notes) {
                if (!Array.isArray(notes)) notes = [];
                document.getElementById('obsidian-result').innerHTML = notes.map(function(n) {
                    return '<div class="note-item"><div class="note-item-header"><span class="note-item-id">' + (n.noteId || n.id || '') + '</span><span class="note-item-vault">' + vault + '</span></div><div class="note-item-content">' + (n.title || n.content || '').substring(0, 200) + '</div></div>';
                }).join('') || '<div style="text-align:center;padding:10px;color:var(--text-muted);">No results.</div>';
            });
    };
})();
</script>
