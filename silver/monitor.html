<div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <span style="font-size:10px;font-weight:700;color:var(--accent-silver);">SILVER AGENTS</span>
        <span style="font-size:8px;color:var(--text-muted);" id="silver-update-time"></span>
    </div>
    <div class="monitor-grid">
        <div class="monitor-panel">
            <div class="section-title" style="color:var(--accent-silver);">AGENTS</div>
            <div id="mon-agents-list" hx-get="/api/Orchestration/status" hx-trigger="load, every 15s" hx-headers='js:{"Authorization":"Bearer "+localStorage.getItem("abitat_token")}' hx-swap="innerHTML">
                <div style="text-align:center;padding:10px;color:var(--text-muted);">Loading agents...</div>
            </div>
        </div>
        <div class="monitor-panel">
            <div class="section-title" style="color:var(--accent-violet);">LABS</div>
            <div id="mon-labs-list" hx-get="/api/Orchestration/agents/violet/labs" hx-trigger="load, every 20s" hx-headers='js:{"Authorization":"Bearer "+localStorage.getItem("abitat_token")}' hx-swap="innerHTML">
                <div style="text-align:center;padding:10px;color:var(--text-muted);">Loading labs...</div>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    var API = window.__API_SILVER__ || (window.location.hostname === 'localhost' ? 'http://localhost:10004' : '');
    var token = localStorage.getItem('abitat_token') || '';

    document.body.addEventListener('htmx:afterRequest', function(evt) {
        if (evt.detail.target.id === 'mon-agents-list') {
            try {
                var data = JSON.parse(evt.detail.xhr.responseText);
                var agents = data.agents || data || {};
                evt.detail.target.innerHTML = Object.keys(agents).map(function(k) {
                    return '<div class="agent-row"><span class="agent-name">' + k + '</span><span class="agent-status">' + agents[k] + '</span></div>';
                }).join('') || '<div style="text-align:center;padding:10px;color:var(--text-muted);">No agents.</div>';
            } catch(e) {}
        }
        if (evt.detail.target.id === 'mon-labs-list') {
            try {
                var labs = JSON.parse(evt.detail.xhr.responseText);
                if (!Array.isArray(labs)) labs = [];
                evt.detail.target.innerHTML = labs.map(function(l) {
                    return '<div class="lab-item"><span class="lab-name">' + (l.name || l.labId) + '</span><span class="lab-status active">' + (l.status || 'ACTIVE') + '</span></div>';
                }).join('') || '<div style="text-align:center;padding:10px;color:var(--text-muted);">No labs.</div>';
            } catch(e) {}
        }
        document.getElementById('silver-update-time').textContent = new Date().toLocaleTimeString();
    });
})();
</script>
